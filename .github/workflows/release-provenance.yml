name: release-provenance

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Signing is not idempotent in a useful way here; let a tag finish.
concurrency:
  group: release-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The validate step runs the paper-evidence snapshot guard, which
          # verifies the recorded evidence revision and its evidence-v1 tag.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - run: mkdir -p artifacts
      - name: Generate release manifest
        run: |
          {
            echo "ghost-ark release manifest"
            echo "git_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            find package.json package-lock.json tsconfig.json dist -type f -print | sort | xargs shasum -a 256
          } > artifacts/release-manifest.sha256
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/sbom.spdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign release manifest
        run: cosign sign-blob --yes --bundle artifacts/release-manifest.sigstore.json artifacts/release-manifest.sha256
      - name: Sign SBOM
        run: cosign sign-blob --yes --bundle artifacts/sbom.sigstore.json artifacts/sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghost-ark-provenance-${{ github.sha }}
          path: artifacts/
      - name: Publish @ghost-ark/kernel-probe to npm with provenance
        # A repository v* tag is not necessarily a kernel-probe release. If this
        # exact version is already on the registry there is nothing to publish,
        # and npm refuses to republish an existing version — so a repo release
        # tag would fail here for a package that is correctly up to date.
        # Publish only a genuinely new version; otherwise say so and succeed.
        run: |
          pkg_version="$(node -p "require('./tools/kernel-probe/package.json').version")"
          if npm view "@ghost-ark/kernel-probe@${pkg_version}" version >/dev/null 2>&1; then
            echo "kernel-probe ${pkg_version} is already on npm; nothing to publish."
          else
            npm publish --provenance --access public --workspace @ghost-ark/kernel-probe
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
