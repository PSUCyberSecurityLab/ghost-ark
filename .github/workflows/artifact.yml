name: artifact-evaluation

# Artifact-evaluation pipeline. The `paper-evidence` job is the reviewer-facing
# manuscript gate; the retained legacy AEC orchestration is explicitly separate.
#
# Paper evidence is fail-closed: E2/E3/E4, TLC, tests, and the tracked-source
# scan must all pass. It deliberately excludes the quarantined benchmark
# programs. The legacy report uploads on success OR failure so a red run remains
# diagnosable, but it does not establish paper evidence.
#
# Read check-run output and the evidence snapshot for current results. A workflow
# definition is not evidence about its own most recent status.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper-evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The gate's release preflight verifies the recorded evidence revision
          # and its evidence-v1 tag; a shallow, tagless checkout fails it
          # honestly. Fetch full history and tags.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Bootstrap reviewer dependencies and pinned TLC
        run: make bootstrap

      - name: Replay paper evidence (E2, E3, E4, TLC, tests, tracked scan)
        run: make paper-evidence

      - name: Upload generated paper-evidence diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper-evidence-diagnostics
          path: |
            artifacts/paper-evidence/**
            artifacts/proofs/**
          if-no-files-found: warn
          retention-days: 30

  legacy-aec-orchestration:
    # This is retained for the broad historical artifact report. It is not the
    # manuscript-evidence gate: it does not run E2/E3/E4 and records quarantined
    # benchmark material as non-evidential diagnostics.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dissertation toolchain (pandoc + TeX Live)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq graphviz pandoc latexmk \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science lmodern

      - name: Bootstrap (deps + pinned tla2tools)
        run: make bootstrap

      - name: Legacy broad report (not manuscript evidence)
        id: reproduce
        run: make reproduce
        # Do not mask the real result; the report step still runs via always().

      - name: Ensure a report exists even if a stage failed
        if: always()
        run: node tools/artifact/aec-report.mjs || true

      - name: Upload artifacts (reports, benchmarks, proof logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-aec-artifacts
          path: |
            artifacts/**
            docs/dissertation/ghost-ark-usenix.pdf
          if-no-files-found: warn
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          if [ -f artifacts/reports/aec_summary.md ]; then
            cat artifacts/reports/aec_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  hermetic-image:
    # Proves Dockerfile.reviewer is self-sufficient (no host setup) by replaying
    # the same paper-evidence gate inside the image.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The image copies the checkout, .git included, so the gate inside it
          # can verify the evidence revision and its evidence-v1 tag. A shallow
          # checkout would bake an incomplete history into the image.
          fetch-depth: 0
          fetch-tags: true
      - name: Build reviewer image
        run: docker build -f Dockerfile.reviewer -t ghost-ark-reviewer:ci .
      - name: Run paper evidence inside the hermetic image
        run: docker run --rm ghost-ark-reviewer:ci
